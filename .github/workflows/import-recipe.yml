
name: Import recipe

run-name: Import recipe ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      recipe_url:
        description: "URL of the recipe to import"
        required: true
        type: string
      request_id:
        description: "Unique ID for this import request"
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract recipe
        env:
          RECIPE_URL: ${{ inputs.recipe_url }}
        run: python scripts/import_recipe.py

      - name: Validate request and output
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          request_id = os.environ["REQUEST_ID"]

          if not re.fullmatch(r"[a-f0-9-]{36}", request_id):
              raise SystemExit("Invalid request ID")

          source = Path("recipe-import.json")

          if not source.is_file():
              raise SystemExit("Recipe output was not created")

          with source.open(encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data.get("ingredients"), list):
              raise SystemExit("Invalid recipe ingredients")

          if not isinstance(data.get("method"), list):
              raise SystemExit("Invalid recipe method")

          print("Recipe output validated successfully.")
          PY

      - name: Upload temporary recipe result
        uses: actions/upload-artifact@v4
        with:
          name: recipe-import-${{ inputs.request_id }}
          path: recipe-import.json
          if-no-files-found: error
          retention-days: 1
