<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupboard</title>
<style>
  :root{
    --oat:#efeae0; --card:#faf8f2; --ink:#2b2620; --ink-soft:#6b6355;
    --herb:#4b6b4a; --herb-dark:#3a5439; --paprika:#b5652b; --brick:#a23b3b;
    --line:#ddd6c6;
    --radius:14px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --oat:#1d1b17; --card:#28251f; --ink:#eee8dc; --ink-soft:#a89f8c;
      --herb:#6a8c68; --herb-dark:#587257; --paprika:#d68a4e; --brick:#d16a5a;
      --line:#413c32;
    }
  }
  :root[data-theme="dark"]{
    --oat:#1d1b17; --card:#28251f; --ink:#eee8dc; --ink-soft:#a89f8c;
    --herb:#6a8c68; --herb-dark:#587257; --paprika:#d68a4e; --brick:#d16a5a;
    --line:#413c32;
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;margin:0;}
  body{
    background:var(--oat); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  h1,h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:600; margin:0;}
  header{
    position:sticky; top:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
    background:var(--oat);
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header h1{font-size:1.5rem; letter-spacing:-0.01em;}
  .status{font-size:0.78rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--herb);display:inline-block;}
  .dot.busy{background:var(--paprika);}
  .dot.err{background:var(--brick);}
  .icon-btn{
    background:none;border:none;font-size:1.3rem;color:var(--ink-soft);
    padding:6px; cursor:pointer; line-height:1;
  }
  main{flex:1; overflow-y:auto; padding:14px 16px 8px; max-width:560px; width:100%; margin:0 auto;}
  .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:0.95rem;}
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:9px;
    display:flex; align-items:center; gap:10px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .row.selected{border-color:var(--herb); box-shadow:0 0 0 2px rgba(75,107,74,0.18);}
  .row.low .qty{color:var(--brick); font-weight:600;}
  .row .name{flex:1; font-size:1.02rem; min-width:0; overflow-wrap:anywhere;}
  .row .qty{font-variant-numeric:tabular-nums; font-size:0.98rem; color:var(--ink-soft); min-width:44px; text-align:right;}
  .del{
    background:none; border:none; color:var(--ink-soft); font-size:1.1rem;
    padding:4px 2px; cursor:pointer;
  }
  .del:active{color:var(--brick);}
  .adjust-bar{
    position:sticky; bottom:0; z-index:5;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:var(--oat); border-top:1px solid var(--line);
    max-width:560px; width:100%; margin:0 auto;
  }
  .adjust-info{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:10px; font-size:0.95rem;
  }
  .adjust-info span{flex:1; min-width:0; overflow-wrap:anywhere;}
  .adjust-info select{
    padding:6px 4px; border-radius:8px; border:1px solid var(--line);
    font-size:0.88rem; background:var(--card); color:var(--ink);
  }
  .adjust-info .close{background:none; border:none; color:var(--ink-soft); font-size:1.05rem; cursor:pointer; padding:2px 4px;}
  .adjust-controls{display:flex; align-items:stretch; gap:8px;}
  .toggle{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0;}
  .toggle .seg{
    width:38px; border:none; background:var(--card); font-size:1.15rem;
    color:var(--ink-soft); cursor:pointer;
  }
  .toggle .seg.active[data-dir="add"]{background:var(--herb); color:#fff;}
  .toggle .seg.active[data-dir="remove"]{background:var(--brick); color:#fff;}
  .presets{display:flex; gap:6px; flex:1;}
  .presets button{
    flex:1; border:1px solid var(--line); border-radius:10px; background:var(--card);
    color:var(--ink); font-size:0.95rem; font-variant-numeric:tabular-nums; cursor:pointer;
    padding:0;
  }
  .presets button:active{background:var(--herb); color:#fff; border-color:var(--herb);}
  .presets button.custom-toggle{flex:0 0 40px; color:var(--ink-soft); font-size:1.1rem;}
  .presets input.custom-input{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; background:var(--card);
    color:var(--ink); font-size:0.95rem; text-align:center; padding:0 6px;
  }
  .presets button.custom-apply{flex:0 0 40px;}
  form#add{
    position:sticky; bottom:0; z-index:5;
    display:flex; gap:8px; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:var(--oat); border-top:1px solid var(--line);
    max-width:560px; width:100%; margin:0 auto;
  }
  form#add input[type=text]{
    flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink);
  }
  form#add input[type=number]{
    width:58px; padding:11px 6px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink); text-align:center;
  }
  form#add select{
    width:58px; padding:11px 2px; border-radius:10px; border:1px solid var(--line);
    font-size:0.9rem; background:var(--card); color:var(--ink); text-align:center;
  }
  form#add button{
    background:var(--herb); color:#fff; border:none; border-radius:10px;
    padding:0 18px; font-size:1.4rem; cursor:pointer;
  }
  form#add button:active{background:var(--herb-dark);}
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,38,32,0.45); z-index:10;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--card); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  }
  .modal h2{font-size:1.2rem; margin-bottom:4px;}
  .modal p.hint{color:var(--ink-soft); font-size:0.85rem; margin:4px 0 16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:0.82rem; color:var(--ink-soft); margin-bottom:4px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink);
  }
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-size:0.98rem; cursor:pointer;
  }
  .btn-primary{background:var(--herb); color:#fff;}
  .btn-primary:active{background:var(--herb-dark);}
  .btn-secondary{background:var(--card); border:1px solid var(--line) !important; color:var(--ink);}
  .error-text{color:var(--brick); font-size:0.82rem; margin-top:8px; display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Cupboard</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading…</span></div>
  </div>
  <div>
    <button class="icon-btn hidden" id="undoBtn" aria-label="Undo">↺</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </div>
</header>

<main>
  <div id="empty" class="empty hidden">Nothing in the cupboard yet. Add something below.</div>
  <div id="list"></div>
</main>

<form id="add">
  <input type="text" id="addName" placeholder="Ingredient" autocomplete="off" required>
  <input type="number" id="addQty" value="1" min="1">
  <select id="addUnit">
    <option value="g">g</option>
    <option value="pcs">pcs</option>
  </select>
  <button type="submit" aria-label="Add">+</button>
</form>

<div id="adjustBar" class="adjust-bar hidden">
  <div class="adjust-info">
    <span id="adjustName"></span>
    <select id="adjustUnit">
      <option value="g">g</option>
      <option value="pcs">pcs</option>
    </select>
    <button type="button" class="close" id="adjustClose" aria-label="Done">Done</button>
  </div>
  <div class="adjust-controls">
    <div class="toggle" id="adjustToggle">
      <button type="button" class="seg" data-dir="add" aria-label="Add">+</button>
      <button type="button" class="seg" data-dir="remove" aria-label="Remove">−</button>
    </div>
    <div class="presets" id="adjustPresets"></div>
  </div>
</div>

<div id="settingsModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Connect to GitHub</h2>
    <p class="hint">Reads and writes Ingredients.txt at the repo root. The token stays only on this device.</p>
    <div class="field">
      <label for="cfgOwner">Repo owner</label>
      <input type="text" id="cfgOwner" placeholder="e.g. cameron">
    </div>
    <div class="field">
      <label for="cfgRepo">Repo name</label>
      <input type="text" id="cfgRepo" placeholder="e.g. cupboard">
    </div>
    <div class="field">
      <label for="cfgToken">Personal access token</label>
      <input type="password" id="cfgToken" placeholder="ghp_… (needs repo contents write access)">
    </div>
    <p class="error-text" id="cfgError"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cfgCancel">Cancel</button>
      <button type="button" class="btn-primary" id="cfgSave">Save & connect</button>
    </div>
  </div>
</div>

<script>
const BRANCH = "main";
const PATH = "Ingredients.txt";
const STORE_KEY = "cupboard-settings-v1";

let settings = null;
let items = [];
let sha = null;
let saveTimer = null;
let saving = false;
let selectedName = null;
let lastDir = "remove";
let customMode = false;
let undoStack = [];

function pushUndo(){
  undoStack.push(JSON.parse(JSON.stringify(items)));
  if(undoStack.length > 20) undoStack.shift();
  document.getElementById("undoBtn").classList.remove("hidden");
}
function undo(){
  if(undoStack.length === 0) return;
  items = undoStack.pop();
  if(undoStack.length === 0) document.getElementById("undoBtn").classList.add("hidden");
  queueSave("Undo last change");
  render();
}

function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(e){ return null; }
}
function persistSettings(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function apiUrl(){
  return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${encodeURIComponent(PATH)}?ref=${BRANCH}`;
}
function authHeaders(){
  return { "Authorization": `Bearer ${settings.token}`, "Accept": "application/vnd.github+json" };
}
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64.replace(/\n/g,""))));
}

function parseText(text){
  const out = [];
  text.split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line) return;
    if(line.includes("|")){
      const parts = line.split("|");
      const unit = (parts.length >= 3 && (parts[2] === "g" || parts[2] === "pcs")) ? parts[2] : "g";
      const name = parts[0];
      let qty = parseInt(parts[1], 10);
      if(isNaN(qty)) qty = 1;
      out.push({name, quantity: qty, unit});
    } else {
      out.push({name: line, quantity: 1, unit: "g"});
    }
  });
  return out;
}
function serialize(list){
  return list.map(i => `${i.name}|${i.quantity}|${i.unit}`).join("\n") + (list.length ? "\n" : "");
}
function titleCase(s){
  return s.trim().replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1).toLowerCase());
}
function presetsFor(qty, unit){
  if(unit === "pcs"){
    if(qty <= 12) return [1, 2, 3];
    if(qty <= 50) return [1, 5, 10];
    return [5, 10, 25];
  }
  if(qty <= 10) return [1, 2, 5];
  if(qty <= 50) return [5, 10, 25];
  if(qty <= 200) return [10, 25, 50];
  if(qty <= 1000) return [25, 50, 100];
  if(qty <= 5000) return [50, 100, 250];
  return [100, 250, 500];
}
function isLowStock(item){
  return item.unit === "pcs" ? item.quantity <= 2 : item.quantity <= 100;
}

function setStatus(state, text){
  const dot = document.getElementById("statusDot");
  const label = document.getElementById("statusText");
  dot.className = "dot" + (state === "busy" ? " busy" : state === "err" ? " err" : "");
  label.textContent = text;
}

async function fetchFile(){
  setStatus("busy", "Loading…");
  try{
    const res = await fetch(apiUrl(), { headers: authHeaders() });
    if(res.status === 404){
      items = []; sha = null;
      setStatus("ok", "Synced");
      render();
      return;
    }
    if(!res.ok) throw new Error(`GitHub error ${res.status}`);
    const data = await res.json();
    sha = data.sha;
    items = parseText(b64DecodeUtf8(data.content));
    setStatus("ok", "Synced");
    render();
  }catch(err){
    setStatus("err", "Couldn't load — check settings");
  }
}

async function pushFile(message){
  saving = true;
  setStatus("busy", "Saving…");
  try{
    const body = {
      message,
      content: b64EncodeUtf8(serialize(items)),
      branch: BRANCH
    };
    if(sha) body.sha = sha;
    let res = await fetch(apiUrl(), { method: "PUT", headers: authHeaders(), body: JSON.stringify(body) });

    if(res.status === 409){
      // sha out of date — refetch and retry once
      const fresh = await fetch(apiUrl(), { headers: authHeaders() });
      if(fresh.ok){ sha = (await fresh.json()).sha; body.sha = sha; }
      res = await fetch(apiUrl(), { method: "PUT", headers: authHeaders(), body: JSON.stringify(body) });
    }
    if(!res.ok) throw new Error(`GitHub error ${res.status}`);
    const data = await res.json();
    sha = data.content.sha;
    setStatus("ok", "Synced");
  }catch(err){
    setStatus("err", "Sync failed — will retry on next change");
  }finally{
    saving = false;
  }
}

function queueSave(message){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => pushFile(message), 700);
}

function render(){
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";
  if(items.length === 0){
    empty.classList.remove("hidden");
    renderAdjustBar();
    return;
  }
  empty.classList.add("hidden");
  items
    .slice()
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(item => {
      const row = document.createElement("div");
      row.className = "row"
        + (item.name === selectedName ? " selected" : "")
        + (isLowStock(item) ? " low" : "");
      row.innerHTML = `
        <span class="name">${item.name}</span>
        <span class="qty">${item.quantity} ${item.unit}</span>
        <button type="button" class="del" aria-label="Remove ${item.name}">✕</button>
      `;
      row.addEventListener("click", () => {
        selectedName = (selectedName === item.name) ? null : item.name;
        customMode = false;
        render();
      });
      row.querySelector(".del").addEventListener("click", e => {
        e.stopPropagation();
        removeItem(item.name);
      });
      list.appendChild(row);
    });
  renderAdjustBar();
}

function renderAdjustBar(){
  const bar = document.getElementById("adjustBar");
  const addForm = document.getElementById("add");
  const item = items.find(i => i.name === selectedName);
  if(!item){
    selectedName = null;
    customMode = false;
    bar.classList.add("hidden");
    addForm.classList.remove("hidden");
    return;
  }
  addForm.classList.add("hidden");
  bar.classList.remove("hidden");
  document.getElementById("adjustName").textContent = item.name;

  const unitSel = document.getElementById("adjustUnit");
  unitSel.value = item.unit;
  unitSel.onchange = () => {
    pushUndo();
    item.unit = unitSel.value;
    queueSave(`Set ${item.name} unit`);
    render();
  };

  const segs = document.querySelectorAll("#adjustToggle .seg");
  segs.forEach(s => {
    s.classList.toggle("active", s.dataset.dir === lastDir);
    s.onclick = () => { lastDir = s.dataset.dir; renderAdjustBar(); };
  });

  const presetsEl = document.getElementById("adjustPresets");
  presetsEl.innerHTML = "";

  if(customMode){
    const input = document.createElement("input");
    input.type = "number";
    input.inputMode = "numeric";
    input.min = "1";
    input.className = "custom-input";
    input.placeholder = "Amount";
    const applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "custom-apply";
    applyBtn.textContent = "✓";
    applyBtn.setAttribute("aria-label", "Apply custom amount");
    const doApply = () => {
      const amt = parseInt(input.value, 10);
      if(!amt || amt <= 0) return;
      customMode = false;
      changeQty(item.name, lastDir === "add" ? amt : -amt);
    };
    applyBtn.onclick = doApply;
    input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); doApply(); } });
    presetsEl.appendChild(input);
    presetsEl.appendChild(applyBtn);
    input.focus();
  } else {
    presetsFor(item.quantity, item.unit).forEach(amt => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = amt;
      b.onclick = () => changeQty(item.name, lastDir === "add" ? amt : -amt);
      presetsEl.appendChild(b);
    });
    const customBtn = document.createElement("button");
    customBtn.type = "button";
    customBtn.className = "custom-toggle";
    customBtn.textContent = "…";
    customBtn.setAttribute("aria-label", "Custom amount");
    customBtn.onclick = () => { customMode = true; renderAdjustBar(); };
    presetsEl.appendChild(customBtn);
  }
}

function changeQty(name, delta){
  const item = items.find(i => i.name === name);
  if(!item) return;
  pushUndo();
  item.quantity += delta;
  if(item.quantity <= 0){
    items = items.filter(i => i.name !== name);
    queueSave(`Remove ${name}`);
  } else {
    queueSave(`Update ${name} quantity`);
  }
  render();
}

function removeItem(name){
  if(!confirm(`Remove ${name}?`)) return;
  pushUndo();
  items = items.filter(i => i.name !== name);
  queueSave(`Remove ${name}`);
  render();
}

function addItem(name, qty, unit){
  name = titleCase(name);
  if(!name || qty <= 0) return;
  pushUndo();
  const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase());
  if(existing){
    existing.quantity += qty;
    queueSave(`Increase ${name}`);
  } else {
    items.push({name, quantity: qty, unit});
    queueSave(`Add ${name}`);
  }
  render();
}

// theme
const THEME_KEY = "cupboard-theme";
function applyTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === "light" || saved === "dark"){
    document.documentElement.setAttribute("data-theme", saved);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
document.getElementById("themeBtn").onclick = () => {
  const current = localStorage.getItem(THEME_KEY) || "auto";
  const next = current === "auto" ? "dark" : current === "dark" ? "light" : "auto";
  if(next === "auto") localStorage.removeItem(THEME_KEY);
  else localStorage.setItem(THEME_KEY, next);
  applyTheme();
};
applyTheme();

document.getElementById("undoBtn").onclick = undo;

document.getElementById("adjustClose").onclick = () => {
  selectedName = null;
  customMode = false;
  render();
};

document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const nameEl = document.getElementById("addName");
  const qtyEl = document.getElementById("addQty");
  const unitEl = document.getElementById("addUnit");
  const qty = parseInt(qtyEl.value, 10) || 1;
  addItem(nameEl.value, qty, unitEl.value);
  nameEl.value = "";
  qtyEl.value = 1;
  nameEl.focus();
});

// settings modal
const modal = document.getElementById("settingsModal");
function openSettings(){
  document.getElementById("cfgOwner").value = settings?.owner || "";
  document.getElementById("cfgRepo").value = settings?.repo || "";
  document.getElementById("cfgToken").value = settings?.token || "";
  document.getElementById("cfgError").style.display = "none";
  modal.classList.remove("hidden");
}
document.getElementById("settingsBtn").onclick = openSettings;
document.getElementById("cfgCancel").onclick = () => {
  if(settings) modal.classList.add("hidden");
};
document.getElementById("cfgSave").onclick = () => {
  const owner = document.getElementById("cfgOwner").value.trim();
  const repo = document.getElementById("cfgRepo").value.trim();
  const token = document.getElementById("cfgToken").value.trim();
  const errEl = document.getElementById("cfgError");
  if(!owner || !repo || !token){
    errEl.textContent = "All three fields are required.";
    errEl.style.display = "block";
    return;
  }
  settings = { owner, repo, token };
  persistSettings(settings);
  modal.classList.add("hidden");
  fetchFile();
};

// boot
settings = loadSettings();
if(!settings){
  setStatus("err", "Not connected");
  openSettings();
} else {
  fetchFile();
}
</script>
</body>
</html>
