<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupboard</title>
<style>
  :root{
    --oat:#efeae0; --card:#faf8f2; --ink:#2b2620; --ink-soft:#6b6355;
    --herb:#4b6b4a; --herb-dark:#3a5439; --paprika:#b5652b; --brick:#a23b3b;
    --line:#ddd6c6;
    --radius:14px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --oat:#1d1b17; --card:#28251f; --ink:#eee8dc; --ink-soft:#a89f8c;
      --herb:#6a8c68; --herb-dark:#587257; --paprika:#d68a4e; --brick:#d16a5a;
      --line:#413c32;
    }
  }
  :root[data-theme="dark"]{
    --oat:#1d1b17; --card:#28251f; --ink:#eee8dc; --ink-soft:#a89f8c;
    --herb:#6a8c68; --herb-dark:#587257; --paprika:#d68a4e; --brick:#d16a5a;
    --line:#413c32;
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;margin:0;}
  body{
    background:var(--oat); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  h1,h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:600; margin:0;}
  header{
    position:sticky; top:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
    background:var(--oat);
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header h1{font-size:1.5rem; letter-spacing:-0.01em;}
  .status{font-size:0.78rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--herb);display:inline-block;}
  .dot.busy{background:var(--paprika);}
  .dot.err{background:var(--brick);}
  .icon-btn{
    background:none;border:none;font-size:1.3rem;color:var(--ink-soft);
    padding:6px; cursor:pointer; line-height:1;
  }
  main{flex:1; overflow-y:auto; padding:14px 16px 8px; max-width:560px; width:100%; margin:0 auto;}
  .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:0.95rem;}
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:9px;
    display:flex; align-items:center; gap:10px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .row.selected{border-color:var(--herb); box-shadow:0 0 0 2px rgba(75,107,74,0.18);}
  .row.low .qty{color:var(--brick); font-weight:600;}
  .row .name{flex:1; font-size:1.02rem; min-width:0; overflow-wrap:anywhere;}
  .row .qty{font-variant-numeric:tabular-nums; font-size:0.98rem; color:var(--ink-soft); min-width:44px; text-align:right;}
  .del{
    background:none; border:none; color:var(--ink-soft); font-size:1.1rem;
    padding:4px 2px; cursor:pointer;
  }
  .del:active{color:var(--brick);}
  .adjust-bar{
    position:sticky; bottom:0; z-index:5;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:var(--oat); border-top:1px solid var(--line);
    max-width:560px; width:100%; margin:0 auto;
  }
  .adjust-info{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:10px; font-size:0.95rem;
  }
  .adjust-info span{flex:1; min-width:0; overflow-wrap:anywhere;}
  .adjust-info select{
    padding:6px 4px; border-radius:8px; border:1px solid var(--line);
    font-size:0.88rem; background:var(--card); color:var(--ink);
  }
  .adjust-info .close{background:none; border:none; color:var(--ink-soft); font-size:1.05rem; cursor:pointer; padding:2px 4px;}
  .adjust-controls{display:flex; align-items:stretch; gap:8px;}
  .toggle{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0;}
  .toggle .seg{
    width:38px; border:none; background:var(--card); font-size:1.15rem;
    color:var(--ink-soft); cursor:pointer;
  }
  .toggle .seg.active[data-dir="add"]{background:var(--herb); color:#fff;}
  .toggle .seg.active[data-dir="remove"]{background:var(--brick); color:#fff;}
  .presets{display:flex; gap:6px; flex:1;}
  .presets button{
    flex:1; border:1px solid var(--line); border-radius:10px; background:var(--card);
    color:var(--ink); font-size:0.95rem; font-variant-numeric:tabular-nums; cursor:pointer;
    padding:0;
  }
  .presets button:active{background:var(--herb); color:#fff; border-color:var(--herb);}
  .presets button.custom-toggle{flex:0 0 40px; color:var(--ink-soft); font-size:1.1rem;}
  .presets input.custom-input{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; background:var(--card);
    color:var(--ink); font-size:0.95rem; text-align:center; padding:0 6px;
  }
  .presets button.custom-apply{flex:0 0 40px;}
  form#add{
    position:sticky; bottom:0; z-index:5;
    display:flex; gap:8px; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:var(--oat); border-top:1px solid var(--line);
    max-width:560px; width:100%; margin:0 auto;
  }
  form#add input[type=text]{
    flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink);
  }
  form#add input[type=number]{
    width:58px; padding:11px 6px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink); text-align:center;
  }
  form#add select{
    width:58px; padding:11px 2px; border-radius:10px; border:1px solid var(--line);
    font-size:0.9rem; background:var(--card); color:var(--ink); text-align:center;
  }
  form#add button{
    background:var(--herb); color:#fff; border:none; border-radius:10px;
    padding:0 18px; font-size:1.4rem; cursor:pointer;
  }
  form#add button:active{background:var(--herb-dark);}
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,38,32,0.45); z-index:10;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--card); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  }
  .modal h2{font-size:1.2rem; margin-bottom:4px;}
  .modal p.hint{color:var(--ink-soft); font-size:0.85rem; margin:4px 0 16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:0.82rem; color:var(--ink-soft); margin-bottom:4px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:1rem; background:var(--card); color:var(--ink);
  }
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-size:0.98rem; cursor:pointer;
  }
  .btn-primary{background:var(--herb); color:#fff;}
  .btn-primary:active{background:var(--herb-dark);}
  .btn-secondary{background:var(--card); border:1px solid var(--line) !important; color:var(--ink);}
  .error-text{color:var(--brick); font-size:0.82rem; margin-top:8px; display:none;}
  .hidden{display:none !important;}

  .tabs{display:flex; gap:8px; padding:10px 16px 0; max-width:560px; margin:0 auto; width:100%;}
  .tab{
    flex:1; padding:9px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:0.92rem; cursor:pointer;
  }
  .tab.active{background:var(--herb); color:#fff; border-color:var(--herb);}

  .recipe-row{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:var(--radius); padding:12px 14px; margin-bottom:9px;
  }
  .recipe-row.green{border-left-color:var(--herb);}
  .recipe-row.yellow{border-left-color:var(--paprika);}
  .recipe-row.red{border-left-color:var(--brick);}
  .recipe-summary{display:flex; align-items:center; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .recipe-info{flex:1; min-width:0;}
  .recipe-name{font-size:1.02rem; overflow-wrap:anywhere;}
  .recipe-sub{font-size:0.85rem; color:var(--ink-soft); margin-top:2px;}
  .recipe-details{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .recipe-block{margin-bottom:12px;}
  .recipe-block-title{font-size:0.8rem; color:var(--ink-soft); margin-bottom:6px;}
  .ri-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:5px;}
  .ri-list li{display:flex; align-items:center; gap:8px; font-size:0.92rem;}
  .ri-icon{
    width:18px; height:18px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:0.7rem; flex-shrink:0; color:#fff;
  }
  .ri-ok .ri-icon{background:var(--herb);}
  .ri-low .ri-icon{background:var(--paprika);}
  .ri-missing .ri-icon{background:var(--brick);}
  .method-list{padding-left:20px; margin:0; display:flex; flex-direction:column; gap:6px; font-size:0.94rem;}
  .recipe-actions{display:flex; gap:10px; margin-top:6px;}
  .recipe-actions button{flex:1; padding:10px; border-radius:10px; font-size:0.9rem; cursor:pointer;}
  .recipe-actions .r-make{background:var(--herb); border:1px solid var(--herb); color:#fff;}
  .recipe-actions .r-make:active{background:var(--herb-dark);}
  .recipe-actions .r-edit{background:var(--card); border:1px solid var(--line); color:var(--ink);}
  .recipe-actions .r-delete{background:none; border:1px solid var(--brick); color:var(--brick);}
  .recipe-footer-btn{
    width:100%; padding:12px; border-radius:10px; background:var(--herb); color:#fff;
    border:none; font-size:1rem; cursor:pointer;
  }
  .recipe-footer-btn:active{background:var(--herb-dark);}

  .recipe-modal{max-height:85vh; overflow-y:auto;}
  .r-ing-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
  .r-ing-row input[type=text]{
    flex:1; min-width:0; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.92rem;
  }
  .r-ing-row input[type=number]{
    width:56px; padding:9px 4px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); text-align:center; font-size:0.92rem;
  }
  .r-ing-row select{
    width:54px; padding:9px 2px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.85rem;
  }
  .r-ing-row button{background:none; border:none; color:var(--ink-soft); font-size:1rem; cursor:pointer; padding:2px 4px;}
  #rAddIngredient{
    width:100%; padding:9px; border-radius:8px; margin-top:2px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.88rem; cursor:pointer;
  }
  textarea#rMethod{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.95rem; font-family:inherit; resize:vertical;
  }
  #rDelete{
    width:100%; margin-top:10px; background:none; border:none; color:var(--brick);
    padding:8px; cursor:pointer; font-size:0.92rem;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Cupboard</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading…</span></div>
  </div>
  <div>
    <button class="icon-btn hidden" id="undoBtn" aria-label="Undo">↺</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button type="button" class="tab active" data-view="cupboard">Cupboard</button>
  <button type="button" class="tab" data-view="recipes">Recipes</button>
</nav>

<main>
  <div id="cupboardView">
    <div id="empty" class="empty hidden">Nothing in the cupboard yet. Add something below.</div>
    <div id="list"></div>
  </div>
  <div id="recipesView" class="hidden">
    <div id="recipeEmpty" class="empty hidden">No recipes yet. Add one below.</div>
    <div id="recipeList"></div>
  </div>
</main>

<form id="add">
  <input type="text" id="addName" placeholder="Ingredient" autocomplete="off" required>
  <input type="number" id="addQty" value="1" min="1">
  <select id="addUnit">
    <option value="g">g</option>
    <option value="pcs">pcs</option>
  </select>
  <button type="submit" aria-label="Add">+</button>
</form>

<div id="adjustBar" class="adjust-bar hidden">
  <div class="adjust-info">
    <span id="adjustName"></span>
    <select id="adjustUnit">
      <option value="g">g</option>
      <option value="pcs">pcs</option>
    </select>
    <button type="button" class="close" id="adjustClose" aria-label="Done">Done</button>
  </div>
  <div class="adjust-controls">
    <div class="toggle" id="adjustToggle">
      <button type="button" class="seg" data-dir="add" aria-label="Add">+</button>
      <button type="button" class="seg" data-dir="remove" aria-label="Remove">−</button>
    </div>
    <div class="presets" id="adjustPresets"></div>
  </div>
</div>

<div id="recipeFooter" class="adjust-bar hidden">
  <button type="button" id="addRecipeBtn" class="recipe-footer-btn">+ Add recipe</button>
</div>

<div id="settingsModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Connect to GitHub</h2>
    <p class="hint">Reads and writes Ingredients.txt at the repo root. The token stays only on this device.</p>
    <div class="field">
      <label for="cfgOwner">Repo owner</label>
      <input type="text" id="cfgOwner" placeholder="e.g. cameron">
    </div>
    <div class="field">
      <label for="cfgRepo">Repo name</label>
      <input type="text" id="cfgRepo" placeholder="e.g. cupboard">
    </div>
    <div class="field">
      <label for="cfgToken">Personal access token</label>
      <input type="password" id="cfgToken" placeholder="ghp_… (needs repo contents write access)">
    </div>
    <p class="error-text" id="cfgError"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cfgCancel">Cancel</button>
      <button type="button" class="btn-primary" id="cfgSave">Save & connect</button>
    </div>
  </div>
</div>

<div id="recipeModal" class="modal-backdrop hidden">
  <div class="modal recipe-modal">
    <h2 id="recipeModalTitle">Add recipe</h2>
    <div class="field">
      <label for="rName">Name</label>
      <input type="text" id="rName">
    </div>
    <div class="field">
      <label for="rBakeTime">Bake time</label>
      <input type="text" id="rBakeTime" placeholder="e.g. 180°C, 45 min">
    </div>
    <div class="field">
      <label>Ingredients</label>
      <div id="rIngredients"></div>
      <button type="button" id="rAddIngredient">+ Add ingredient</button>
    </div>
    <div class="field">
      <label for="rMethod">Method (one step per line)</label>
      <textarea id="rMethod" rows="6"></textarea>
    </div>
    <p class="error-text" id="rError"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="rCancel">Cancel</button>
      <button type="button" class="btn-primary" id="rSave">Save recipe</button>
    </div>
    <button type="button" id="rDelete" class="hidden">Delete recipe</button>
  </div>
</div>

<script>
const BRANCH = "main";
const PATH = "Ingredients.txt";
const RECIPES_PATH = "Recipes.json";
const STORE_KEY = "cupboard-settings-v1";

let settings = null;
let items = [];
let sha = null;
let saveTimer = null;
let saving = false;
let selectedName = null;
let lastDir = "remove";
let customMode = false;
let undoStack = [];

let recipes = [];
let recipesSha = null;
let recipeSaveTimer = null;
let expandedRecipe = null;
let editingRecipeName = null;
let currentView = "cupboard";

function pushUndo(){
  undoStack.push(JSON.parse(JSON.stringify(items)));
  if(undoStack.length > 20) undoStack.shift();
  document.getElementById("undoBtn").classList.remove("hidden");
}

function undo(){
  if(undoStack.length === 0) return;
  items = undoStack.pop();
  if(undoStack.length === 0) document.getElementById("undoBtn").classList.add("hidden");
  queueSave("Undo last change");
  render();
  if(currentView === "recipes") renderRecipes();
}

function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(e){ return null; }
}
function persistSettings(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function apiUrl(path = PATH){
  return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${encodeURIComponent(path)}?ref=${BRANCH}`;
}

function authHeaders(){
  return {
    "Authorization": `Bearer ${settings.token}`,
    "Accept": "application/vnd.github+json"
  };
}

function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64.replace(/\n/g,""))));
}

function parseText(text){
  const out = [];
  text.split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line) return;
    if(line.includes("|")){
      const parts = line.split("|");
      const unit = (parts.length >= 3 && (parts[2] === "g" || parts[2] === "pcs")) ? parts[2] : "g";
      const name = parts[0];
      let qty = parseInt(parts[1], 10);
      if(isNaN(qty)) qty = 1;
      out.push({name, quantity: qty, unit});
    } else {
      out.push({name: line, quantity: 1, unit: "g"});
    }
  });
  return out;
}

function serialize(list){
  return list.map(i => `${i.name}|${i.quantity}|${i.unit}`).join("\n") + (list.length ? "\n" : "");
}

function titleCase(s){
  return s.trim().replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1).toLowerCase());
}

function normaliseName(s){
  return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function presetsFor(qty, unit){
  if(unit === "pcs"){
    if(qty <= 12) return [1, 2, 3];
    if(qty <= 50) return [1, 5, 10];
    return [5, 10, 25];
  }
  if(qty <= 10) return [1, 2, 5];
  if(qty <= 50) return [5, 10, 25];
  if(qty <= 200) return [10, 25, 50];
  if(qty <= 1000) return [25, 50, 100];
  if(qty <= 5000) return [50, 100, 250];
  return [100, 250, 500];
}

function isLowStock(item){
  return item.unit === "pcs" ? item.quantity <= 2 : item.quantity <= 100;
}

function setStatus(state, text){
  const dot = document.getElementById("statusDot");
  const label = document.getElementById("statusText");
  dot.className = "dot" + (state === "busy" ? " busy" : state === "err" ? " err" : "");
  label.textContent = text;
}

async function getGithubFile(path){
  const res = await fetch(apiUrl(path), {headers: authHeaders()});
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`GitHub error ${res.status}`);
  const data = await res.json();
  return {
    sha: data.sha,
    text: b64DecodeUtf8(data.content)
  };
}

async function fetchFile(){
  setStatus("busy", "Loading…");
  try{
    const data = await getGithubFile(PATH);
    if(!data){
      items = [];
      sha = null;
    } else {
      sha = data.sha;
      items = parseText(data.text);
    }
    try{
      await fetchRecipes(false);
    }catch(e){
      setStatus("err", "Cupboard loaded — recipes failed");
      render();
      return;
    }
    setStatus("ok", "Synced");
    render();
  }catch(err){
    setStatus("err", "Couldn't load — check settings");
  }
}

// Returns true on success, false on failure.
async function pushFile(message){
  saving = true;
  setStatus("busy", "Saving…");
  try{
    const body = {
      message,
      content: b64EncodeUtf8(serialize(items)),
      branch: BRANCH
    };
    if(sha) body.sha = sha;

    let res = await fetch(apiUrl(PATH), {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(body)
    });

    if(res.status === 409){
      const fresh = await fetch(apiUrl(PATH), {headers: authHeaders()});
      if(fresh.ok){
        sha = (await fresh.json()).sha;
        body.sha = sha;
      }
      res = await fetch(apiUrl(PATH), {
        method: "PUT",
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
    }

    if(!res.ok) throw new Error(`GitHub error ${res.status}`);
    const data = await res.json();
    sha = data.content.sha;
    setStatus("ok", "Synced");
    return true;
  }catch(err){
    setStatus("err", "Sync failed — will retry on next change");
    return false;
  }finally{
    saving = false;
  }
}

function queueSave(message){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => pushFile(message), 700);
}

/* ---------------- Recipes ---------------- */

function normaliseRecipe(recipe){
  return {
    name: String(recipe?.name || "").trim(),
    bakeTime: String(recipe?.bakeTime || "").trim(),
    ingredients: Array.isArray(recipe?.ingredients)
      ? recipe.ingredients.map(i => ({
          name: String(i?.name || "").trim(),
          quantity: Number(i?.quantity) || 0,
          unit: i?.unit === "pcs" ? "pcs" : "g"
        })).filter(i => i.name && i.quantity > 0)
      : [],
    method: Array.isArray(recipe?.method)
      ? recipe.method.map(s => String(s).trim()).filter(Boolean)
      : []
  };
}

function normaliseRecipes(data){
  if(Array.isArray(data)) return data.map(normaliseRecipe).filter(r => r.name);
  return [];
}

function recipesJson(){
  return JSON.stringify(recipes, null, 2) + "\n";
}

async function fetchRecipes(updateStatus = true){
  if(updateStatus) setStatus("busy", "Loading recipes…");
  try{
    const data = await getGithubFile(RECIPES_PATH);
    if(!data){
      recipes = [];
      recipesSha = null;
    }else{
      recipesSha = data.sha;
      try{
        recipes = normaliseRecipes(JSON.parse(data.text));
      }catch(e){
        throw new Error("Recipes.json is not valid JSON");
      }
    }
    if(updateStatus) setStatus("ok", "Synced");
    if(currentView === "recipes") renderRecipes();
  }catch(err){
    if(updateStatus) setStatus("err", "Couldn't load recipes");
    throw err;
  }
}

async function pushRecipes(message){
  setStatus("busy", "Saving…");
  try{
    const body = {
      message,
      content: b64EncodeUtf8(recipesJson()),
      branch: BRANCH
    };
    if(recipesSha) body.sha = recipesSha;

    let res = await fetch(apiUrl(RECIPES_PATH), {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify(body)
    });

    if(res.status === 409){
      const fresh = await fetch(apiUrl(RECIPES_PATH), {headers: authHeaders()});
      if(fresh.ok){
        const freshData = await fresh.json();
        recipesSha = freshData.sha;
        body.sha = recipesSha;
      }
      res = await fetch(apiUrl(RECIPES_PATH), {
        method: "PUT",
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
    }

    if(!res.ok) throw new Error(`GitHub error ${res.status}`);
    const data = await res.json();
    recipesSha = data.content.sha;
    setStatus("ok", "Synced");
    return true;
  }catch(err){
    setStatus("err", "Recipe save failed");
    return false;
  }
}

function queueRecipeSave(message){
  clearTimeout(recipeSaveTimer);
  recipeSaveTimer = setTimeout(() => pushRecipes(message), 700);
}

function getRecipeAvailability(recipe){
  let missing = 0;
  let low = 0;

  const details = recipe.ingredients.map(ingredient => {
    const cupboard = items.find(
      item => normaliseName(item.name) === normaliseName(ingredient.name)
    );

    const available = cupboard ? cupboard.quantity : 0;

    if(!cupboard || available <= 0){
      missing++;
      return {...ingredient, available, status:"missing"};
    }

    if(cupboard.unit !== ingredient.unit){
      low++;
      return {...ingredient, available, haveUnit: cupboard.unit, status:"low", mismatch:true};
    }

    if(available < ingredient.quantity){
      low++;
      return {...ingredient, available, haveUnit: cupboard.unit, status:"low"};
    }

    return {...ingredient, available, haveUnit: cupboard.unit, status:"ok"};
  });

  let colour = "green";
  if(missing >= 4) colour = "red";
  else if(missing >= 1 || low > 0) colour = "yellow";

  return {colour, missing, low, details};
}

function availabilityText(result){
  if(result.colour === "green") return "Everything available";
  const parts = [];
  if(result.missing) parts.push(`${result.missing} missing`);
  if(result.low) parts.push(`${result.low} insufficient`);
  return parts.join(" · ");
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderRecipes(){
  const list = document.getElementById("recipeList");
  const empty = document.getElementById("recipeEmpty");
  list.innerHTML = "";

  if(recipes.length === 0){
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  recipes
    .slice()
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(recipe => {
      const result = getRecipeAvailability(recipe);
      const row = document.createElement("div");
      row.className = `recipe-row ${result.colour}`;

      const summary = document.createElement("div");
      summary.className = "recipe-summary";
      summary.innerHTML = `
        <div class="recipe-info">
          <div class="recipe-name">${escapeHtml(recipe.name)}</div>
          <div class="recipe-sub">${escapeHtml(recipe.bakeTime || "No time specified")} · ${escapeHtml(availabilityText(result))}</div>
        </div>
        <span aria-hidden="true">${expandedRecipe === recipe.name ? "⌃" : "⌄"}</span>
      `;

      summary.addEventListener("click", () => {
        expandedRecipe = expandedRecipe === recipe.name ? null : recipe.name;
        renderRecipes();
      });

      row.appendChild(summary);

      if(expandedRecipe === recipe.name){
        const details = document.createElement("div");
        details.className = "recipe-details";

        const ingBlock = document.createElement("div");
        ingBlock.className = "recipe-block";
        ingBlock.innerHTML = `<div class="recipe-block-title">Ingredients</div>`;

        const ul = document.createElement("ul");
        ul.className = "ri-list";

        result.details.forEach(i => {
          const li = document.createElement("li");
          li.className = `ri-${i.status}`;

          const icon = i.status === "ok" ? "✓" : i.status === "low" ? "!" : "×";

          let text = `${i.name} — ${i.quantity} ${i.unit}`;
          if(i.status === "low" && i.mismatch){
            text += ` (cupboard is in ${i.haveUnit} — unit differs)`;
          }else if(i.status === "low"){
            text += ` (have ${i.available} ${i.haveUnit})`;
          }else if(i.status === "missing"){
            text += " (missing)";
          }

          li.innerHTML = `
            <span class="ri-icon">${icon}</span>
            <span>${escapeHtml(text)}</span>
          `;
          ul.appendChild(li);
        });

        ingBlock.appendChild(ul);
        details.appendChild(ingBlock);

        if(recipe.method.length){
          const methodBlock = document.createElement("div");
          methodBlock.className = "recipe-block";
          methodBlock.innerHTML = `<div class="recipe-block-title">Method</div>`;

          const methodList = document.createElement("ol");
          methodList.className = "method-list";

          recipe.method.forEach(step => {
            const li = document.createElement("li");
            li.textContent = step;
            methodList.appendChild(li);
          });

          methodBlock.appendChild(methodList);
          details.appendChild(methodBlock);
        }

        const actions = document.createElement("div");
        actions.className = "recipe-actions";

        const make = document.createElement("button");
        make.type = "button";
        make.className = "r-make";
        make.textContent = "Make";
        make.onclick = () => makeRecipe(recipe.name);

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "r-edit";
        edit.textContent = "Edit";
        edit.onclick = () => openRecipeModal(recipe.name);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "r-delete";
        del.textContent = "Delete";
        del.onclick = () => deleteRecipe(recipe.name);

        actions.appendChild(make);
        actions.appendChild(edit);
        actions.appendChild(del);
        details.appendChild(actions);

        row.appendChild(details);
      }

      list.appendChild(row);
    });
}

function render(){
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";

  if(items.length === 0){
    empty.classList.remove("hidden");
    renderAdjustBar();
    return;
  }

  empty.classList.add("hidden");

  items
    .slice()
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(item => {
      const row = document.createElement("div");
      row.className = "row"
        + (item.name === selectedName ? " selected" : "")
        + (isLowStock(item) ? " low" : "");

      row.innerHTML = `
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="qty">${item.quantity} ${item.unit}</span>
        <button type="button" class="del" aria-label="Remove ${escapeHtml(item.name)}">✕</button>
      `;

      row.addEventListener("click", () => {
        selectedName = (selectedName === item.name) ? null : item.name;
        customMode = false;
        render();
      });

      row.querySelector(".del").addEventListener("click", e => {
        e.stopPropagation();
        removeItem(item.name);
      });

      list.appendChild(row);
    });

  renderAdjustBar();
}

function renderAdjustBar(){
  const bar = document.getElementById("adjustBar");
  const addForm = document.getElementById("add");
  const item = items.find(i => i.name === selectedName);

  // Only the Cupboard tab owns these bars.
  if(currentView !== "cupboard"){
    bar.classList.add("hidden");
    addForm.classList.add("hidden");
    return;
  }

  if(!item){
    selectedName = null;
    customMode = false;
    bar.classList.add("hidden");
    addForm.classList.remove("hidden");
    return;
  }

  addForm.classList.add("hidden");
  bar.classList.remove("hidden");
  document.getElementById("adjustName").textContent = item.name;

  const unitSel = document.getElementById("adjustUnit");
  unitSel.value = item.unit;
  unitSel.onchange = () => {
    pushUndo();
    item.unit = unitSel.value;
    queueSave(`Set ${item.name} unit`);
    render();
  };

  const segs = document.querySelectorAll("#adjustToggle .seg");
  segs.forEach(s => {
    s.classList.toggle("active", s.dataset.dir === lastDir);
    s.onclick = () => { lastDir = s.dataset.dir; renderAdjustBar(); };
  });

  const presetsEl = document.getElementById("adjustPresets");
  presetsEl.innerHTML = "";

  if(customMode){
    const input = document.createElement("input");
    input.type = "number";
    input.inputMode = "numeric";
    input.min = "1";
    input.className = "custom-input";
    input.placeholder = "Amount";

    const applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "custom-apply";
    applyBtn.textContent = "✓";
    applyBtn.setAttribute("aria-label", "Apply custom amount");

    const doApply = () => {
      const amt = parseInt(input.value, 10);
      if(!amt || amt <= 0) return;
      customMode = false;
      changeQty(item.name, lastDir === "add" ? amt : -amt);
    };

    applyBtn.onclick = doApply;
    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){
        e.preventDefault();
        doApply();
      }
    });

    presetsEl.appendChild(input);
    presetsEl.appendChild(applyBtn);
    input.focus();
  }else{
    presetsFor(item.quantity, item.unit).forEach(amt => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = amt;
      b.onclick = () => changeQty(item.name, lastDir === "add" ? amt : -amt);
      presetsEl.appendChild(b);
    });

    const customBtn = document.createElement("button");
    customBtn.type = "button";
    customBtn.className = "custom-toggle";
    customBtn.textContent = "…";
    customBtn.setAttribute("aria-label", "Custom amount");
    customBtn.onclick = () => { customMode = true; renderAdjustBar(); };
    presetsEl.appendChild(customBtn);
  }
}

function changeQty(name, delta){
  const item = items.find(i => i.name === name);
  if(!item) return;

  pushUndo();
  item.quantity += delta;

  if(item.quantity <= 0){
    items = items.filter(i => i.name !== name);
    queueSave(`Remove ${name}`);
  }else{
    queueSave(`Update ${name} quantity`);
  }

  render();
  if(currentView === "recipes") renderRecipes();
}

function removeItem(name){
  if(!confirm(`Remove ${name}?`)) return;

  pushUndo();
  items = items.filter(i => i.name !== name);
  queueSave(`Remove ${name}`);
  render();
  if(currentView === "recipes") renderRecipes();
}

function addItem(name, qty, unit){
  name = titleCase(name);
  if(!name || qty <= 0) return;

  pushUndo();

  const existing = items.find(i => normaliseName(i.name) === normaliseName(name));

  if(existing){
    existing.quantity += qty;
    queueSave(`Increase ${name}`);
  }else{
    items.push({name, quantity: qty, unit});
    queueSave(`Add ${name}`);
  }

  render();
  if(currentView === "recipes") renderRecipes();
}

/* ---------------- Recipe editor ---------------- */

function addRecipeIngredientRow(data = {name:"", quantity:1, unit:"g"}){
  const container = document.getElementById("rIngredients");

  const row = document.createElement("div");
  row.className = "r-ing-row";

  const name = document.createElement("input");
  name.type = "text";
  name.placeholder = "Ingredient";
  name.value = data.name || "";

  const qty = document.createElement("input");
  qty.type = "number";
  qty.min = "1";
  qty.step = "1";
  qty.value = data.quantity || 1;

  const unit = document.createElement("select");
  unit.innerHTML = `
    <option value="g">g</option>
    <option value="pcs">pcs</option>
  `;
  unit.value = data.unit === "pcs" ? "pcs" : "g";

  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "✕";
  remove.setAttribute("aria-label", "Remove ingredient");
  remove.onclick = () => row.remove();

  row.appendChild(name);
  row.appendChild(qty);
  row.appendChild(unit);
  row.appendChild(remove);
  container.appendChild(row);
}

function openRecipeModal(name = null){
  const modal = document.getElementById("recipeModal");
  const recipe = name ? recipes.find(r => r.name === name) : null;

  editingRecipeName = recipe ? recipe.name : null;

  document.getElementById("recipeModalTitle").textContent =
    recipe ? "Edit recipe" : "Add recipe";

  document.getElementById("rName").value = recipe?.name || "";
  document.getElementById("rBakeTime").value = recipe?.bakeTime || "";
  document.getElementById("rMethod").value = recipe?.method?.join("\n") || "";
  document.getElementById("rError").style.display = "none";

  const ingredients = document.getElementById("rIngredients");
  ingredients.innerHTML = "";

  if(recipe && recipe.ingredients.length){
    recipe.ingredients.forEach(i => addRecipeIngredientRow(i));
  }else{
    addRecipeIngredientRow();
  }

  document.getElementById("rDelete").classList.toggle("hidden", !recipe);
  modal.classList.remove("hidden");
}

function closeRecipeModal(){
  document.getElementById("recipeModal").classList.add("hidden");
  editingRecipeName = null;
}

function saveRecipeFromModal(){
  const error = document.getElementById("rError");

  const name = document.getElementById("rName").value.trim();
  const bakeTime = document.getElementById("rBakeTime").value.trim();
  const method = document.getElementById("rMethod").value
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(Boolean);

  const ingredients = Array.from(document.querySelectorAll("#rIngredients .r-ing-row"))
    .map(row => {
      const inputs = row.querySelectorAll("input");
      const select = row.querySelector("select");
      return {
        name: inputs[0].value.trim(),
        quantity: Number(inputs[1].value),
        unit: select.value
      };
    })
    .filter(i => i.name);

  if(!name){
    error.textContent = "Recipe name is required.";
    error.style.display = "block";
    return;
  }

  if(!ingredients.length){
    error.textContent = "Add at least one ingredient.";
    error.style.display = "block";
    return;
  }

  if(ingredients.some(i => !i.quantity || i.quantity <= 0)){
    error.textContent = "Each ingredient needs a quantity greater than zero.";
    error.style.display = "block";
    return;
  }

  const duplicate = recipes.some(
    r => normaliseName(r.name) === normaliseName(name)
      && normaliseName(r.name) !== normaliseName(editingRecipeName || "")
  );

  if(duplicate){
    error.textContent = "A recipe with that name already exists.";
    error.style.display = "block";
    return;
  }

  const recipe = normaliseRecipe({
    name,
    bakeTime,
    ingredients,
    method
  });

  if(editingRecipeName){
    const index = recipes.findIndex(r => r.name === editingRecipeName);
    if(index >= 0) recipes[index] = recipe;
  }else{
    recipes.push(recipe);
  }

  const wasEditing = !!editingRecipeName;
  expandedRecipe = recipe.name;
  closeRecipeModal();
  renderRecipes();
  pushRecipes(wasEditing ? `Update recipe: ${name}` : `Add recipe: ${name}`);
}

async function makeRecipe(name){
  const recipe = recipes.find(r => r.name === name);
  if(!recipe) return;

  const result = getRecipeAvailability(recipe);

  // A recipe can only be made when every ingredient is available
  // in the required quantity and unit.
  if(result.colour !== "green"){
    const reasons = [];
    if(result.missing) reasons.push(`${result.missing} missing`);
    if(result.low) reasons.push(`${result.low} insufficient`);
    alert(`You don't have enough ingredients to make ${recipe.name} (${reasons.join(", ")}).`);
    return;
  }

  if(!confirm(`Make ${recipe.name}? This will remove the required quantities from your cupboard.`)){
    return;
  }

  // Cancel any pending debounced save so it can't overlap with this one.
  clearTimeout(saveTimer);

  // Make it undoable with the ↺ button.
  pushUndo();

  recipe.ingredients.forEach(ingredient => {
    const item = items.find(
      i => normaliseName(i.name) === normaliseName(ingredient.name)
    );
    if(item) item.quantity -= ingredient.quantity;
  });

  items = items.filter(i => i.quantity > 0);

  selectedName = null;
  customMode = false;
  render();
  renderRecipes();

  // pushFile reports its own failure via the status line; the local
  // change stays and the next edit will retry the sync.
  await pushFile(`Make recipe: ${recipe.name}`);
}

// Returns true if the recipe was deleted, false if cancelled or not found.
async function deleteRecipe(name){
  if(!name) return false;
  if(!confirm(`Delete ${name}?`)) return false;

  const before = recipes.length;
  recipes = recipes.filter(r => normaliseName(r.name) !== normaliseName(name));

  if(recipes.length === before) return false;

  if(expandedRecipe === name) expandedRecipe = null;
  renderRecipes();

  await pushRecipes(`Delete recipe: ${name}`);
  return true;
}

/* ---------------- View / theme / settings ---------------- */

function switchView(view){
  currentView = view;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.view === view);
  });

  document.getElementById("cupboardView").classList.toggle("hidden", view !== "cupboard");
  document.getElementById("recipesView").classList.toggle("hidden", view !== "recipes");
  document.getElementById("recipeFooter").classList.toggle("hidden", view !== "recipes");

  if(view === "recipes"){
    renderAdjustBar(); // hides the cupboard bars
    renderRecipes();
  }else{
    render();
  }
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => switchView(tab.dataset.view));
});

document.getElementById("addRecipeBtn").onclick = () => openRecipeModal();
document.getElementById("rAddIngredient").onclick = () => addRecipeIngredientRow();
document.getElementById("rCancel").onclick = closeRecipeModal;
document.getElementById("rSave").onclick = saveRecipeFromModal;
document.getElementById("rDelete").onclick = async () => {
  const nameToDelete = editingRecipeName;
  if(!nameToDelete) return;

  const button = document.getElementById("rDelete");
  button.disabled = true;
  button.textContent = "Deleting…";

  const deleted = await deleteRecipe(nameToDelete);

  button.disabled = false;
  button.textContent = "Delete recipe";
  if(deleted) closeRecipeModal();
};

document.getElementById("recipeModal").addEventListener("click", e => {
  if(e.target.id === "recipeModal") closeRecipeModal();
});

// theme
const THEME_KEY = "cupboard-theme";
function applyTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === "light" || saved === "dark"){
    document.documentElement.setAttribute("data-theme", saved);
  }else{
    document.documentElement.removeAttribute("data-theme");
  }
}

document.getElementById("themeBtn").onclick = () => {
  const current = localStorage.getItem(THEME_KEY) || "auto";
  const next = current === "auto" ? "dark" : current === "dark" ? "light" : "auto";
  if(next === "auto") localStorage.removeItem(THEME_KEY);
  else localStorage.setItem(THEME_KEY, next);
  applyTheme();
};

applyTheme();
document.getElementById("undoBtn").onclick = undo;

document.getElementById("adjustClose").onclick = () => {
  selectedName = null;
  customMode = false;
  render();
};

document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const nameEl = document.getElementById("addName");
  const qtyEl = document.getElementById("addQty");
  const unitEl = document.getElementById("addUnit");

  const qty = parseInt(qtyEl.value, 10) || 1;
  addItem(nameEl.value, qty, unitEl.value);

  nameEl.value = "";
  qtyEl.value = 1;
  nameEl.focus();
});

// settings modal
const modal = document.getElementById("settingsModal");

function openSettings(){
  document.getElementById("cfgOwner").value = settings?.owner || "";
  document.getElementById("cfgRepo").value = settings?.repo || "";
  document.getElementById("cfgToken").value = settings?.token || "";
  document.getElementById("cfgError").style.display = "none";
  modal.classList.remove("hidden");
}

document.getElementById("settingsBtn").onclick = openSettings;

document.getElementById("cfgCancel").onclick = () => {
  if(settings) modal.classList.add("hidden");
};

document.getElementById("cfgSave").onclick = () => {
  const owner = document.getElementById("cfgOwner").value.trim();
  const repo = document.getElementById("cfgRepo").value.trim();
  const token = document.getElementById("cfgToken").value.trim();
  const errEl = document.getElementById("cfgError");

  if(!owner || !repo || !token){
    errEl.textContent = "All three fields are required.";
    errEl.style.display = "block";
    return;
  }

  settings = {owner, repo, token};
  persistSettings(settings);
  modal.classList.add("hidden");
  fetchFile();
};

// boot
settings = loadSettings();

if(!settings){
  setStatus("err", "Not connected");
  openSettings();
}else{
  fetchFile();
}
